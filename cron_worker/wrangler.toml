name = "theme-flow-cron"
main = "src/index.js"
compatibility_date = "2026-09-01"
# workers.dev のURLは不要(定時起動のみ)。/status を使う時だけ true にする
workers_dev = false
preview_urls = false

# UTC。JST = UTC+9。無料枠の登録数を節約するため1本にまとめ、src/index.js の PLAN で時刻ごとに振り分ける
#   08:00 起動(日本株 17:00 JST) / 09:00・11:00 見張り
#   22:00 起動(米国株 7:00 JST)  / 23:00・01:00 見張り
[triggers]
crons = ["0 1,8,9,11,22,23 * * *"]
