<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>銘柄詳細へ移動します｜投資家ハシビロコウの株式ダッシュボード</title>
<link rel="icon" href="../assets/icon-64.png">
<script>
/* 2026-10-15〜 銘柄の詳細は stock.html(4タブ)に移った。古いリンク・ブックマーク用に、コードとタブを引き継いで移る
   旧タブ: #chart(業績・財務のグラフ)→#perf / #eval→#eval / #div→#div */
(function () {
  var map = {chart: 'perf', eval: 'eval', div: 'div'}, h = location.hash.slice(1);
  location.replace('stock.html' + location.search + (map[h] ? '#' + map[h] : ''));
})();
</script>
</head><body>
<p style="font-family:sans-serif;padding:24px">銘柄詳細のページへ移動します。移動しない場合は<a href="stock.html">こちら</a>。</p>
</body></html>
