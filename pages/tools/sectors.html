<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>セクター状況｜テーマ別資金フロー</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<style>
/* ツール共通 */
nav.tools{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:25}
nav.tools .wrap{display:flex;align-items:center;gap:26px;overflow-x:auto;scrollbar-width:none}
nav.tools a,nav.tools span.soon{padding:12px 0;font-size:14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav.tools a.on{color:var(--ink);border-bottom-color:var(--brand)}
nav.tools span.soon{color:var(--faint)}
nav.tools span.soon small{font-size:10px;margin-left:4px}
nav.tools .upd{margin-left:auto;font-size:12px;color:var(--faint);white-space:nowrap}
.member{display:inline-block;font-size:11px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:1px 9px;margin-left:8px;vertical-align:3px}
/* セクター状況 */
.top3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:16px 0}
@media (max-width:760px){.top3{grid-template-columns:minmax(0,1fr)}}
.t3{display:flex;align-items:center;gap:14px;padding:16px 18px}
.t3 .no{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 14px var(--f-num);background:var(--surface-2);color:var(--muted);flex:none}
.t3:first-child .no{background:var(--brand);color:var(--brand-ink)}
.t3 .tn{min-width:0;flex:1}
.t3 .tn b{display:block;font-size:15px;line-height:1.4}
.top3>.panel+.panel{margin-top:0}
.t3 .tn small{display:block;color:var(--faint);font-family:var(--f-num);font-size:11px}
.t3 .v{font:600 22px var(--f-num)}
.sx-wrap{overflow-x:auto;margin:0 -6px}
table.sx{width:100%;border-collapse:collapse;font-size:12.5px;min-width:980px}
table.sx th{position:sticky;top:0;background:var(--surface);font-size:11px;color:var(--faint);font-weight:500;padding:8px 8px;border-bottom:1px solid var(--line-strong);text-align:right;white-space:nowrap;cursor:pointer;user-select:none}
table.sx th.l{text-align:left}
table.sx th.sel{color:var(--brand);border-bottom:2px solid var(--brand)}
table.sx td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-family:var(--f-num);font-variant-numeric:tabular-nums}
table.sx td.l{text-align:left;font-family:var(--f-body)}
table.sx td .tk{font:600 12px var(--f-num);color:var(--brand)}
table.sx td .nm2{display:block;font-size:12px;color:var(--ink);max-width:190px;overflow:hidden;text-overflow:ellipsis}
table.sx td.g{color:var(--faint);font-size:11px;font-family:var(--f-body)}
table.sx td.heat{font-weight:500}
table.sx tbody tr:hover td{outline:0;box-shadow:inset 0 0 0 9999px rgba(var(--brandrgb),.05)}
.trend{font-size:12px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.tile{border-radius:8px;padding:9px 10px;min-height:66px;display:flex;flex-direction:column;justify-content:space-between}
.tile b{font-size:12px;line-height:1.35}
.tile small{font:500 10.5px var(--f-num);opacity:.8}
.tile span{font:600 15px var(--f-num)}
.ghead{font-size:12px;color:var(--muted);font-weight:700;margin:14px 0 6px}
</style>
</head><body>

<header class="top">
  <div class="wrap hbar">
    <a class="logo" href="../index.html" aria-label="テーマ別資金フロー トップ">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="var(--brand)"/><path d="M9 20c3-7 9-10 15-9-3 1-5 3-6 6l-9 3z" fill="var(--brand-ink)"/><circle cx="19" cy="13" r="1.4" fill="var(--brand)"/></svg>
      <b>テーマ別 資金フロー</b>
    </a>
    <div class="mseg" role="group" aria-label="市場" id="mseg"><button data-m="jp" aria-pressed="true">日本株</button><button data-m="us" aria-pressed="false">米国株</button></div>
    <span style="flex:1"></span>
    <a class="hlink" href="../index.html">トップ</a>
    <a class="hlink" href="../note.html">note紹介銘柄検証</a>
    <a class="btn" href="../join.html">ログイン</a>
  </div>
</header>
<nav class="tools" aria-label="ツール">
  <div class="wrap">
    <a href="sectors.html" class="on">セクター状況</a>
    <span class="soon">業種状況<small>準備中</small></span>
    <span class="soon">業種銘柄リサーチ<small>準備中</small></span>
    <span class="upd" id="upd"></span>
  </div>
</nav>

<main class="wrap">
<section class="sec">
  <div class="sec-head">
    <div><div class="eyebrow">Tools · Sector status</div><h2>セクター状況<span class="member">会員ツール</span></h2></div>
    <div class="meta num" id="meta"></div>
  </div>

  <div class="panel">
    <div class="ctlrow"><span class="ctl-label">期間</span><div class="seg" id="per"></div></div>
    <div class="ctlrow"><span class="ctl-label">分類</span><div class="seg" id="grp"></div></div>
    <div class="ctlrow"><span class="ctl-label">表示</span>
      <div class="seg" id="view"><button data-v="list" aria-pressed="true">リスト</button><button data-v="heat" aria-pressed="false">ヒートマップ</button></div>
      <span class="search" style="margin-left:6px"><input id="q" type="text" placeholder="名前・ティッカー" autocomplete="off"></span>
      <span class="phint" id="cnt"></span></div>
  </div>

  <div class="top3" id="top3"></div>

  <div class="panel">
    <div id="list"><div class="sx-wrap"><table class="sx"><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div></div>
    <div id="heat" hidden></div>
    <div class="foot" id="foot"></div>
  </div>
</section>
</main>

<footer>
  <div class="wrap">
    <div><b style="font-family:var(--f-display);color:var(--ink);font-size:14px">テーマ別 資金フロー</b><br>運営：投資家ハシビロコウ ・ 当サイトの情報は投資助言ではありません。投資判断はご自身の責任でお願いします。</div>
    <nav><a href="../learn.html">学ぶ</a><a href="../join.html">会員案内・ログイン</a><a href="../about.html">運営者情報・免責</a></nav>
  </div>
</footer>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt=(x,d=2)=>x==null||!isFinite(x)?'–':Number(x).toLocaleString('ja-JP',{minimumFractionDigits:d,maximumFractionDigits:d});
const sign=(x,d=2)=>x==null||!isFinite(x)?'–':(x>=0?'+':'−')+fmt(Math.abs(x),d)+'%';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DATA={jp:null,us:null};
let mk='jp',D=null;
const st={per:'m0',grp:'all',view:'list',q:'',sort:null,dir:-1};
try{mk=new URLSearchParams(location.search).get('m')||localStorage.getItem('tf_market')||'jp';}catch(e){}

function pers(){const M=D.months||[];return [['chg1','1日'],['w1','1週'],['m0','今月（'+(M[0]||'')+'）'],['m1',M[1]],['m2',M[2]],['m3',M[3]],['r6m','6か月'],['ytd','年初来'],['hi52','52週高値から']];}
function val(x,k){if(k[0]==='m'&&k.length===2)return x.months[+k[1]];return x[k];}
function heatBg(v,scale){if(v==null)return'';const a=Math.min(1,Math.abs(v)/scale)*0.55;return `background:rgba(${v>=0?cssv('--brandrgb'):cssv('--downrgb')},${a.toFixed(2)})`;}
function spark(a){if(!a||a.length<2)return'';const w=70,h=18,lo=Math.min(...a),hi=Math.max(...a),rg=hi-lo||1;let p='';
  a.forEach((v,i)=>p+=(i?'L':'M')+(i/(a.length-1)*w).toFixed(1)+' '+(h-1-(v-lo)/rg*(h-2)).toFixed(1)+' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:inline-block;vertical-align:middle"><path d="${p}" fill="none" stroke="${a[a.length-1]>=a[0]?'var(--up)':'var(--down)'}" stroke-width="1.4"/></svg>`;}
const TREND={up:['▲','上昇','up'],flat:['―','中立','muted'],down:['▼','下落','down']};

function rows(){let R=D.rows.filter(x=>st.grp==='all'||x.group===st.grp);
  if(st.q){const q=st.q.normalize('NFKC').toLowerCase();R=R.filter(x=>(x.name+' '+x.key).normalize('NFKC').toLowerCase().includes(q));}
  const k=st.sort||st.per,dir=st.sort?st.dir:-1;
  return R.slice().sort((a,b)=>{const x=k==='name'?a.name:val(a,k),y=k==='name'?b.name:val(b,k);if(x==null)return 1;if(y==null)return -1;return (x<y?-1:x>y?1:0)*dir;});}

function drawCtl(){
  $('#per').innerHTML=pers().map(([k,l])=>`<button data-k="${k}" aria-pressed="${k===st.per}">${esc(l)}</button>`).join('');
  $('#per').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.per=b.dataset.k;st.sort=null;draw();};
  const G=['all',...D.groups.filter(g=>D.rows.some(x=>x.group===g))];
  $('#grp').innerHTML=G.map(g=>`<button data-g="${esc(g)}" aria-pressed="${g===st.grp}">${g==='all'?'すべて':esc(g)}</button>`).join('');
  $('#grp').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.grp=b.dataset.g;draw();};
}
function draw(){
  drawCtl();const R=rows(),k=st.per,label=pers().find(p=>p[0]===k)[1];
  const up=D.rows.filter(x=>(x.chg1||0)>0).length,dn=D.rows.filter(x=>(x.chg1||0)<0).length;
  $('#meta').innerHTML=`${mk==='us'?'米国株':'日本株'} ・ ${D.updated}まで ・ <span class="up">▲${up}</span> <span class="muted">＝${D.rows.length-up-dn}</span> <span class="down">▼${dn}</span>（前日比）`;
  $('#upd').textContent=mk==='us'?'毎日 7:00 JST 更新':'毎日 17:00 JST 更新';
  $('#cnt').textContent=`${R.length}件`;
  const ranked=R.filter(x=>val(x,k)!=null).sort((a,b)=>k==='hi52'?val(b,k)-val(a,k):val(b,k)-val(a,k)).slice(0,3);
  $('#top3').innerHTML=ranked.map((x,i)=>{const v=val(x,k);return `<div class="panel t3"><span class="no">${i+1}</span><div class="tn"><b>${esc(x.name)}</b><small>${x.etf?esc(x.key):'東証33業種'} ・ ${esc(label)}</small></div><span class="v ${v>=0?'up':'down'}">${sign(v)}</span></div>`;}).join('');
  if(st.view==='list'){$('#list').hidden=false;$('#heat').hidden=true;drawTable(R);}else{$('#list').hidden=true;$('#heat').hidden=false;drawHeat(R);}
  $('#foot').innerHTML=mk==='us'
    ?'<b>データ</b>：各ETFの日次終値（Yahoo Finance）。<b>月の列</b>はその月の騰落（今月は月初来）。<b>RS</b>＝3か月（40%）・6か月・9か月・12か月（各20%）の騰落を一覧の中で順位づけ（1〜99）。<b>トレンド</b>＝株価・50日線・200日線の並び（上昇＝株価＞50日線＞200日線）。'
    :'<b>データ</b>：東証33業種は、各業種の構成銘柄（東証上場の内国普通株）の日次騰落を等しい重みで平均して自前で算出（価格の表示なし）。TOPIX-17業種・指数・テーマはETFの日次終値（Yahoo Finance）。<b>月の列</b>はその月の騰落（今月は月初来）。<b>RS</b>＝3か月（40%）・6か月・9か月・12か月（各20%）の騰落を一覧の中で順位づけ（1〜99）。<b>トレンド</b>＝株価・50日線・200日線の並び。';
}
function drawTable(R){
  const cols=[['name','銘柄・テーマ','l'],['group','分類','l'],['last','現在値',''],...pers().map(([k,l])=>[k,l,'']),['rs','RS',''],['trend','トレンド',''],['spark','直近60日','']];
  const sk=st.sort||st.per;
  $('#thead').innerHTML=cols.map(([k,l,c])=>`<th class="${c} ${k===st.per?'sel':''}" data-k="${k}">${esc(l)}${k===sk?(st.sort?(st.dir>0?' ▲':' ▼'):' ▼'):''}</th>`).join('');
  $$('#thead th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(k==='spark'||k==='trend'||k==='group')return;
    if(st.sort===k)st.dir=-st.dir;else{st.sort=k;st.dir=k==='name'?1:-1;}draw();});
  const scale={chg1:3,w1:6,m0:10,m1:10,m2:10,m3:10,r6m:25,ytd:35,hi52:25};
  $('#tbody').innerHTML=R.map(x=>{const t=TREND[x.trend]||TREND.flat;
    return `<tr><td class="l"><span class="tk">${x.etf?esc(x.key):''}</span><span class="nm2">${esc(x.name)}</span></td><td class="l g">${esc(x.group)}</td>
      <td>${x.last==null?'<span class="muted">指数</span>':fmt(x.last,x.last>=1000?0:2)}</td>
      ${pers().map(([k])=>{const v=val(x,k);return `<td class="heat ${v>=0?'up':'down'}" style="${heatBg(v,scale[k])}">${sign(v)}</td>`;}).join('')}
      <td>${x.rs}</td><td><span class="trend ${t[2]}" title="${t[1]}">${t[0]} ${t[1]}</span></td><td>${spark(x.spark)}</td></tr>`;}).join('')
    ||'<tr><td colspan="16" class="l muted" style="padding:14px">該当がありません。</td></tr>';
}
function drawHeat(R){const k=st.per,scale={chg1:3,w1:6,m0:10,m1:10,m2:10,m3:10,r6m:25,ytd:35,hi52:25}[k];
  const groups=st.grp==='all'?D.groups:[st.grp];
  $('#heat').innerHTML=groups.map(g=>{const G=R.filter(x=>x.group===g).sort((a,b)=>(val(b,k)??-1e9)-(val(a,k)??-1e9));if(!G.length)return'';
    return `<div class="ghead">${esc(g)}</div><div class="tiles">${G.map(x=>{const v=val(x,k),a=v==null?0:Math.min(1,Math.abs(v)/scale);
      const bg=v==null?'var(--surface-2)':`rgba(${v>=0?cssv('--brandrgb'):cssv('--downrgb')},${(0.12+a*0.78).toFixed(2)})`,fg=a>0.55?'#fff':'var(--ink)';
      return `<div class="tile" style="background:${bg};color:${fg}" title="${esc(x.name)} ${sign(v)}"><b>${esc(x.name)}</b><small>${x.etf?esc(x.key):''}</small><span>${sign(v)}</span></div>`;}).join('')}</div>`;}).join('');}

function load(m){mk=m;$$('#mseg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===mk));try{localStorage.setItem('tf_market',mk);}catch(e){}
  if(DATA[mk]){D=DATA[mk];st.grp='all';draw();return;}
  $('#tbody').innerHTML='<tr><td class="l muted" style="padding:14px">読み込み中…</td></tr>';
  fetch('../pro/sectors_'+mk+'.json?cb='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{
    if(!j){$('#tbody').innerHTML='<tr><td class="l muted" style="padding:14px">データを準備中です。</td></tr>';return;}
    DATA[mk]=j;D=j;st.grp='all';draw();}).catch(()=>{$('#tbody').innerHTML='<tr><td class="l muted" style="padding:14px">データを読み込めませんでした。</td></tr>';});}
$('#mseg').onclick=e=>{const b=e.target.closest('button');if(b)load(b.dataset.m);};
$('#view').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.view=b.dataset.v;$$('#view button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw();};
$('#q').addEventListener('input',e=>{st.q=e.target.value.trim();draw();});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>D&&draw());
load(mk==='us'?'us':'jp');
</script>
</body></html>
