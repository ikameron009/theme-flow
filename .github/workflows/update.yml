name: Update theme flow
# Cloudflare Worker(cron_worker/)が workflow_dispatch で時刻どおり起動する。run-nameの[市場]で見張り/予備判定が識別する
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Update theme flow [{0}]', inputs.market) || (github.event_name == 'schedule' && 'Update theme flow (backup cron)' || github.event.head_commit.message) }}

on:
  schedule:
    # 2段階: 08:00 UTC = 17:00 JST → 日本株のみ取得(当日の大引け後。翌3:00だとYahooの前日分が未反映)。
    #        22:00 UTC = 翌07:00 JST → 米国株+世界のみ取得(米引け後で確定)。
    # ※GitHubの定時cronは数十分〜数時間遅れることがある(無料枠の仕様)。
    - cron: '0 8 * * 1-5'    # 17:00 JST 日本株(当日の大引け後)
    - cron: '0 22 * * 1-5'   # 07:00 JST 米国株+世界
  workflow_dispatch:
    inputs:
      market:
        description: 'jp / us / both / skip'
        default: 'both'
  push:
    branches: [ main ]       # コード/VCP JSON更新時: 再取得も再集計もせずキャッシュから軽量デプロイ

permissions:
  contents: read
  actions: read

# ★衝突しても"キャンセルしない"= 定時フェッチがVCP pushに殺されない(順番待ち)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---- 予備cronの判定: Workerの起動分が済んでいれば(成功 or 実行中)何もしない ----
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ github.event.schedule }}" = "0 8 * * 1-5" ]; then M=jp; else M=us; fi
          SINCE=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          N=$(gh run list -R "${{ github.repository }}" --workflow update.yml --event workflow_dispatch --created ">=$SINCE" --limit 20 --json displayTitle,status,conclusion --jq "[.[] | select((.displayTitle|contains(\"[$M]\")) or (.displayTitle|contains(\"[both]\"))) | select(.conclusion==\"success\" or .status!=\"completed\")] | length") || N=0
          echo "market=$M 済み件数=$N"
          if [ "$N" -gt 0 ]; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    outputs:
      incomplete: ${{ steps.chk.outputs.incomplete }}
      detail: ${{ steps.chk.outputs.detail }}
    steps:
      # 順番待ちのあいだにVCPの結果などがpushされることがあるので、起動時のコミットではなく開始時点の最新のmainを取る
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      # 価格pklだけでなく、集計JSONとOHLCもキャッシュ。
      # → 自市場だけ取得・再集計し、相手市場とpush時(skip)はキャッシュから即デプロイできる。
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: |
            ./*.pkl
            ./macro_fresh.csv
            ./theme_flow.json
            ./us_theme_flow.json
            ./macro.json
            ./market_jp.json
            ./market_us.json
            ./pro_*.json
            ./card_*.json
            ./etf_aum.json
            ./note_track.json
            ./note_picks_auto.csv
            ./calendar.json
            ./cal_shares.csv
            ./site/ohlc
            ./site/us_ohlc
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Decide market
        id: mkt
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 8 * * 1-5" ]; then M=jp; else M=us; fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            M="${{ github.event.inputs.market }}"; [ -z "$M" ] && M=both
          else
            M=skip
          fi
          # キャッシュに必要物が無い(初回/失効)なら全取得にフォールバック
          if [ ! -f close.pkl ] || [ ! -f us_close.pkl ] || [ ! -f theme_flow.json ] || [ ! -f us_theme_flow.json ]; then
            M=both
          fi
          echo "market=$M" >> "$GITHUB_OUTPUT"
          echo "MARKET=$M"

      # ---- 取得(自市場のみ) ----
      - name: 02 JP 価格取得
        if: steps.mkt.outputs.market == 'jp' || steps.mkt.outputs.market == 'both'
        run: python 02_fetch_prices.py

      - name: US 02 米国株 価格取得
        if: steps.mkt.outputs.market == 'us' || steps.mkt.outputs.market == 'both'
        run: python us_02_fetch.py || echo "US価格取得失敗; 前回分を維持"

      - name: 05 クロスアセット取得(世界)
        if: steps.mkt.outputs.market == 'us' || steps.mkt.outputs.market == 'both'
        run: python 05_fetch_macro.py || echo "macro fetch failed; 前回分を維持"

      - name: 08 金利取得(日本MOF・先進国)
        if: steps.mkt.outputs.market == 'us' || steps.mkt.outputs.market == 'both'
        run: python 08_fetch_rates.py || echo "rates fetch failed"

      # ---- 集計+OHLC(自市場のみ再生成。相手市場・skip時はキャッシュのJSON/OHLCをそのまま使う) ----
      - name: 03 日本株テーマ別集計
        if: steps.mkt.outputs.market == 'jp' || steps.mkt.outputs.market == 'both'
        run: python 03_aggregate.py || echo "JP集計スキップ"

      - name: 10 日本株 市場概況(地合い・業種・指数)
        if: steps.mkt.outputs.market == 'jp' || steps.mkt.outputs.market == 'both'
        run: python 10_market.py --market jp || echo "JP市場概況スキップ; 前回分を維持"

      - name: 11 日本株 ツール:セクター状況
        if: steps.mkt.outputs.market == 'jp' || steps.mkt.outputs.market == 'both'
        run: python 11_tool_sectors.py --market jp || echo "JPセクター状況スキップ; 前回分を維持"

      - name: 12 日本株 ツール:業種状況
        if: steps.mkt.outputs.market == 'jp' || steps.mkt.outputs.market == 'both'
        run: python 12_tool_themes.py --market jp || echo "JP業種状況スキップ; 前回分を維持"

      - name: 13 日本株 ツール:業種銘柄リサーチ
        if: steps.mkt.outputs.market == 'jp' || steps.mkt.outputs.market == 'both'
        run: python 13_tool_research.py --market jp || echo "JP業種銘柄リサーチスキップ; 前回分を維持"

      - name: 07 日本株OHLC(site/ohlc)
        if: steps.mkt.outputs.market == 'jp' || steps.mkt.outputs.market == 'both'
        run: python 07_write_ohlc.py || echo "JP OHLC生成スキップ"

      - name: US 03 米国テーマ別集計
        if: steps.mkt.outputs.market == 'us' || steps.mkt.outputs.market == 'both'
        run: python us_03_aggregate.py || echo "US集計スキップ"

      - name: US 10 米国株 市場概況(地合い・業種・指数)
        if: steps.mkt.outputs.market == 'us' || steps.mkt.outputs.market == 'both'
        run: python 10_market.py --market us || echo "US市場概況スキップ; 前回分を維持"

      - name: US 11 米国株 ツール:セクター状況
        if: steps.mkt.outputs.market == 'us' || steps.mkt.outputs.market == 'both'
        run: python 11_tool_sectors.py --market us || echo "USセクター状況スキップ; 前回分を維持"

      - name: US 12 米国株 ツール:業種状況
        if: steps.mkt.outputs.market == 'us' || steps.mkt.outputs.market == 'both'
        run: python 12_tool_themes.py --market us || echo "US業種状況スキップ; 前回分を維持"

      - name: US 13 米国株 ツール:業種銘柄リサーチ
        if: steps.mkt.outputs.market == 'us' || steps.mkt.outputs.market == 'both'
        run: python 13_tool_research.py --market us || echo "US業種銘柄リサーチスキップ; 前回分を維持"

      - name: US 07 米国OHLC(site/us_ohlc)
        if: steps.mkt.outputs.market == 'us' || steps.mkt.outputs.market == 'both'
        run: python us_07_ohlc.py || echo "US OHLC生成スキップ"

      - name: 06 クロスアセット集計(世界)
        if: steps.mkt.outputs.market == 'us' || steps.mkt.outputs.market == 'both'
        run: |
          python 06_macro_agg.py || python -c "import json;open('macro.json','w',encoding='utf-8').write(json.dumps({'updated':'','start':'','dates':[],'cats':[],'ratesPx':[],'inst':{},'ratios':[]},ensure_ascii=False))"

      # ---- index.html生成(毎回・キャッシュ済JSON/OHLC + コミット済VCP JSONを反映) ----
      - name: 14 note紹介記事検証(配当込み・TOPIX/S&P500ほか)
        if: steps.mkt.outputs.market != 'skip'
        run: python 14_note_track.py || echo "note紹介記事検証スキップ; 前回分を維持"

      # 決算・経済カレンダー(今日から2週間)。軽いので毎回(push時も)作り直す。失敗したら前回分(キャッシュ)のまま
      - name: 15 決算・経済カレンダー
        timeout-minutes: 8
        run: python 15_calendar.py || echo "カレンダー取得スキップ; 前回分を維持"

      - name: 04 index.html 生成
        run: python 04_build_html.py

      # 取りこぼし判定(02/us_02 が書く fetch_status_*.json)。公開は前日分のまま済ませ、最後の verify で失敗扱いにする
      - name: 取得の完全性チェック
        id: chk
        run: python check_status.py

      # 公開先: Cloudflare Workers(静的配信) site_worker/wrangler.toml → https://theme-flow.ikameron009.workers.dev
      - name: Cloudflareへ公開
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for i in 1 2 3; do
            npx -y wrangler@4 deploy --config site_worker/wrangler.toml && exit 0
            echo "retry $i"; sleep 30
          done
          exit 1

  # 取りこぼしがあった回はランを失敗にする → Cloudflare Workerの見張りが再実行・通知
  verify:
    needs: [build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.build.outputs.incomplete }}" = "true" ]; then
            echo "::error::データの取りこぼし: ${{ needs.build.outputs.detail }}"; exit 1
          fi
          echo "取得は完全です"
