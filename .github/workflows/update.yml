name: Update theme flow

on:
  schedule:
    # 2段階: 18:00 UTC = 翌03:00 JST → 日本株のみ取得(前営業日の確定足・寄付き前)。
    #        22:00 UTC = 翌07:00 JST → 米国株+世界のみ取得(米引け後で確定)。
    # UTCの日-木 = JSTの月-金(取引日)。※GitHubの定時cronは数十分〜数時間遅れることがある。
    - cron: '0 18 * * 0-4'   # 03:00 JST 日本株
    - cron: '0 22 * * 0-4'   # 07:00 JST 米国株+世界
  workflow_dispatch:
    inputs:
      market:
        description: 'jp / us / both'
        default: 'both'
  push:
    branches: [ main ]       # コード/JSON(VCP)更新時は再取得せずキャッシュから再ビルド&デプロイ

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      # 直近ランのpkl(両市場の価格)を復元。市場別に「自分だけ取得・相手はキャッシュ」で
      # フルサイトを作るために使う。run_idキー+restore-keysで常に最新を復元。
      - name: Restore price cache
        uses: actions/cache@v4
        with:
          path: |
            ./*.pkl
            ./macro_fresh.csv
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Decide market
        id: mkt
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 18 * * 0-4" ]; then M=jp; else M=us; fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            M="${{ github.event.inputs.market }}"; [ -z "$M" ] && M=both
          else
            M=skip
          fi
          # キャッシュにpklが無い(初回/失効)なら全取得にフォールバック
          if [ ! -f close.pkl ] || [ ! -f us_close.pkl ]; then M=both; fi
          echo "market=$M" >> "$GITHUB_OUTPUT"
          echo "MARKET=$M"

      # ---- 日本株の取得(3:00 JSTの回 / both / 初回) ----
      - name: 02 JP 価格取得
        if: steps.mkt.outputs.market == 'jp' || steps.mkt.outputs.market == 'both'
        run: python 02_fetch_prices.py

      # ---- 米国株+世界の取得(7:00 JSTの回 / both / 初回) ----
      - name: US 02 米国株 価格取得
        if: steps.mkt.outputs.market == 'us' || steps.mkt.outputs.market == 'both'
        run: python us_02_fetch.py || echo "US価格取得失敗; 前回分を維持"

      - name: 05 クロスアセット取得(世界)
        if: steps.mkt.outputs.market == 'us' || steps.mkt.outputs.market == 'both'
        run: python 05_fetch_macro.py || echo "macro fetch failed; 前回分を維持"

      - name: 08 金利取得(日本MOF・先進国)
        if: steps.mkt.outputs.market == 'us' || steps.mkt.outputs.market == 'both'
        run: python 08_fetch_rates.py || echo "rates fetch failed"

      # ---- 集計・OHLC・ビルドは毎回実行(取得しなかった市場はキャッシュのpklから再生成) ----
      - name: 03 日本株テーマ別集計
        run: python 03_aggregate.py || echo "JP集計スキップ(pkl未取得?)"

      - name: 07 日本株OHLC(site/ohlc)
        run: python 07_write_ohlc.py || echo "JP OHLC生成スキップ"

      - name: US 03 米国テーマ別集計
        run: python us_03_aggregate.py || echo "US集計スキップ"

      - name: US 07 米国OHLC(site/us_ohlc)
        run: python us_07_ohlc.py || echo "US OHLC生成スキップ"

      - name: 06 クロスアセット集計
        run: |
          python 06_macro_agg.py || python -c "import json;open('macro.json','w',encoding='utf-8').write(json.dumps({'updated':'','start':'','dates':[],'cats':[],'ratesPx':[],'inst':{},'ratios':[]},ensure_ascii=False))"

      - name: 04 index.html 生成
        run: python 04_build_html.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
