name: Update theme flow
# Cloudflare Worker(cron_worker/)が workflow_dispatch で時刻どおり起動する。run-nameの[市場]で見張り/予備判定が識別する
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Update theme flow [{0}]', inputs.market) || (github.event_name == 'schedule' && 'Update theme flow (backup cron)' || github.event.head_commit.message) }}

on:
  schedule:
    # 2段階: 18:00 UTC = 翌03:00 JST → 日本株のみ取得(前営業日の確定足・寄付き前)。
    #        22:00 UTC = 翌07:00 JST → 米国株+世界のみ取得(米引け後で確定)。
    # ※GitHubの定時cronは数十分〜数時間遅れることがある(無料枠の仕様)。
    - cron: '0 18 * * 0-4'   # 03:00 JST 日本株
    - cron: '0 22 * * 0-4'   # 07:00 JST 米国株+世界
  workflow_dispatch:
    inputs:
      market:
        description: 'jp / us / both / skip'
        default: 'both'
  push:
    branches: [ main ]       # コード/VCP JSON更新時: 再取得も再集計もせずキャッシュから軽量デプロイ

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# ★衝突しても"キャンセルしない"= 定時フェッチがVCP pushに殺されない(順番待ち)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---- 予備cronの判定: Workerの起動分が済んでいれば(成功 or 実行中)何もしない ----
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ github.event.schedule }}" = "0 18 * * 0-4" ]; then M=jp; else M=us; fi
          SINCE=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          N=$(gh run list -R "${{ github.repository }}" --workflow update.yml --event workflow_dispatch --created ">=$SINCE" --limit 20 --json displayTitle,status,conclusion --jq "[.[] | select((.displayTitle|contains(\"[$M]\")) or (.displayTitle|contains(\"[both]\"))) | select(.conclusion==\"success\" or .status!=\"completed\")] | length") || N=0
          echo "market=$M 済み件数=$N"
          if [ "$N" -gt 0 ]; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      # 価格pklだけでなく、集計JSONとOHLCもキャッシュ。
      # → 自市場だけ取得・再集計し、相手市場とpush時(skip)はキャッシュから即デプロイできる。
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: |
            ./*.pkl
            ./macro_fresh.csv
            ./theme_flow.json
            ./us_theme_flow.json
            ./macro.json
            ./site/ohlc
            ./site/us_ohlc
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Decide market
        id: mkt
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 18 * * 0-4" ]; then M=jp; else M=us; fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            M="${{ github.event.inputs.market }}"; [ -z "$M" ] && M=both
          else
            M=skip
          fi
          # キャッシュに必要物が無い(初回/失効)なら全取得にフォールバック
          if [ ! -f close.pkl ] || [ ! -f us_close.pkl ] || [ ! -f theme_flow.json ] || [ ! -f us_theme_flow.json ]; then
            M=both
          fi
          echo "market=$M" >> "$GITHUB_OUTPUT"
          echo "MARKET=$M"

      # ---- 取得(自市場のみ) ----
      - name: 02 JP 価格取得
        if: steps.mkt.outputs.market == 'jp' || steps.mkt.outputs.market == 'both'
        run: python 02_fetch_prices.py

      - name: US 02 米国株 価格取得
        if: steps.mkt.outputs.market == 'us' || steps.mkt.outputs.market == 'both'
        run: python us_02_fetch.py || echo "US価格取得失敗; 前回分を維持"

      - name: 05 クロスアセット取得(世界)
        if: steps.mkt.outputs.market == 'us' || steps.mkt.outputs.market == 'both'
        run: python 05_fetch_macro.py || echo "macro fetch failed; 前回分を維持"

      - name: 08 金利取得(日本MOF・先進国)
        if: steps.mkt.outputs.market == 'us' || steps.mkt.outputs.market == 'both'
        run: python 08_fetch_rates.py || echo "rates fetch failed"

      # ---- 集計+OHLC(自市場のみ再生成。相手市場・skip時はキャッシュのJSON/OHLCをそのまま使う) ----
      - name: 03 日本株テーマ別集計
        if: steps.mkt.outputs.market == 'jp' || steps.mkt.outputs.market == 'both'
        run: python 03_aggregate.py || echo "JP集計スキップ"

      - name: 07 日本株OHLC(site/ohlc)
        if: steps.mkt.outputs.market == 'jp' || steps.mkt.outputs.market == 'both'
        run: python 07_write_ohlc.py || echo "JP OHLC生成スキップ"

      - name: US 03 米国テーマ別集計
        if: steps.mkt.outputs.market == 'us' || steps.mkt.outputs.market == 'both'
        run: python us_03_aggregate.py || echo "US集計スキップ"

      - name: US 07 米国OHLC(site/us_ohlc)
        if: steps.mkt.outputs.market == 'us' || steps.mkt.outputs.market == 'both'
        run: python us_07_ohlc.py || echo "US OHLC生成スキップ"

      - name: 06 クロスアセット集計(世界)
        if: steps.mkt.outputs.market == 'us' || steps.mkt.outputs.market == 'both'
        run: |
          python 06_macro_agg.py || python -c "import json;open('macro.json','w',encoding='utf-8').write(json.dumps({'updated':'','start':'','dates':[],'cats':[],'ratesPx':[],'inst':{},'ratios':[]},ensure_ascii=False))"

      # ---- index.html生成(毎回・キャッシュ済JSON/OHLC + コミット済VCP JSONを反映) ----
      - name: 04 index.html 生成
        run: python 04_build_html.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

