name: Update theme flow

on:
  schedule:
    # 22:00 UTC = 翌07:00 JST(UTC日-木 = JST月-金)。毎朝7時に全タブ更新。
    # この時刻は「直近の確定した取引日」を集計: 日本株=前営業日(当日はまだ寄り前)、
    # 米国株/世界=数時間前に引けた直近セッション(=17:00JSTより新しい米国データが載る)。
    # ※GitHubの定時cronは混雑で数十分〜数時間遅れることがある(無料枠の仕様)。
    - cron: '0 22 * * 0-4'
  workflow_dispatch:        # 手動実行ボタン
  push:
    branches: [ main ]      # push時にも一度ビルド（初回確認用）

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      # 注: 01(株探スクレイプ)はクラウドIPから弾かれやすいためCIでは実行しない。
      # コミット済みの themes_map.csv を使う。テーマ更新はローカルで 01 を回して push。

      - name: 02 価格・出来高取得（yfinance）
        run: python 02_fetch_prices.py

      - name: 03 テーマ別集計
        run: python 03_aggregate.py

      - name: 07 ローソク足用OHLC出力(site/ohlc)
        run: python 07_write_ohlc.py || echo "ohlc生成スキップ"

      # --- 米国株テーマ(失敗しても日本株/世界タブは維持) ---
      - name: US 02 米国株 価格取得（yfinance）
        run: python us_02_fetch.py || echo "US価格取得失敗; 米国株タブは今回休止"

      - name: US 03 米国テーマ別集計
        run: python us_03_aggregate.py || echo "US集計スキップ"

      - name: US 07 米国ローソク足OHLC出力(site/us_ohlc)
        run: python us_07_ohlc.py || echo "US OHLC生成スキップ"

      - name: 05 クロスアセット取得(世界のお金の流れ・失敗しても継続)
        run: python 05_fetch_macro.py || echo "macro fetch failed; 世界タブは今回休止"

      - name: 08 金利取得(日本MOF・先進国FRED・失敗しても継続)
        run: python 08_fetch_rates.py || echo "rates fetch failed"

      - name: 06 クロスアセット集計(失敗時は空jsonでビルド継続)
        run: |
          python 06_macro_agg.py || python -c "import json;open('macro.json','w',encoding='utf-8').write(json.dumps({'updated':'','start':'','dates':[],'cats':[],'ratesPx':[],'inst':{},'ratios':[]},ensure_ascii=False))"

      - name: 04 index.html 生成
        run: python 04_build_html.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
