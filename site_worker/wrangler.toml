# 公開サイト(テーマ別資金フロー)= Cloudflare Workers の静的ファイル配信
# site/ を配信する。会員限定(/pro/*)の門番は src/index.js に後で追加する(③C)。
name = "theme-flow"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

[assets]
directory = "../site"
binding = "ASSETS"
# いまは全部そのまま配信。会員限定を入れる時に /pro/* だけ Worker を先に通す
run_worker_first = false

# 本人専用の売買記録(/api/journal/*)の保存先。表は migrations/ で作る
#   npx wrangler@4 d1 migrations apply trade-journal --remote
[[d1_databases]]
binding = "JOURNAL_DB"
database_name = "trade-journal"
database_id = "9ebbb9bd-51e6-4495-b1ab-d34dd0c3cbfd"

# 売買記録のログイン。"off" = ログインを省略(URLを知っていれば誰でも見られる・書ける)、"on" = パスワードが必要
[vars]
JOURNAL_AUTH = "off"

# 定時実行は持たない(定時起動は cron_worker/ の theme-flow-cron が担当)
[triggers]
crons = []
